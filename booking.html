<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - CineBook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎬 CineBook</h1>
            <nav>
                <a href="index.html">Movies</a>
                <a href="#bookings">My Bookings</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="booking-container">
            <div class="movie-selected-info">
                <h2 id="selectedMovie">Movie Title</h2>
                <p id="selectedShowtime">Showtime: --</p>
            </div>

            <div class="seat-selection">
                <div class="screen">
                    <div class="screen-text">SCREEN</div>
                </div>

                <div class="seats-container" id="seatsContainer">
                    <!-- Seats will be dynamically generated -->
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="seat available"></div>
                        <span>Available</span>
                    </div>
                    <div class="legend-item">
                        <div class="seat selected"></div>
                        <span>Selected</span>
                    </div>
                    <div class="legend-item">
                        <div class="seat occupied"></div>
                        <span>Occupied</span>
                    </div>
                </div>
            </div>

            <div class="booking-summary">
                <h3>Booking Summary</h3>
                <div class="summary-details">
                    <div class="summary-row">
                        <span>Selected Seats:</span>
                        <span id="selectedSeatsDisplay">None</span>
                    </div>
                    <div class="summary-row">
                        <span>Number of Tickets:</span>
                        <span id="ticketCount">0</span>
                    </div>
                    <div class="summary-row">
                        <span>Price per Ticket:</span>
                        <span id="ticketPrice">$12</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total Amount:</span>
                        <span id="totalAmount">$0</span>
                    </div>
                </div>

                <form id="bookingForm" class="booking-form">
                    <h4>Your Details</h4>
                    <div class="form-group">
                        <label for="userName">Full Name *</label>
                        <input type="text" id="userName" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmail">Email *</label>
                        <input type="email" id="userEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="userPhone">Phone Number *</label>
                        <input type="tel" id="userPhone" required>
                    </div>
                    <button type="submit" class="btn-book" id="bookButton" disabled>Book Tickets</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 CineBook. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
