<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎬 CineBook</h1>
            <nav>
                <a href="index.html" class="active">Movies</a>
                <a href="#bookings">My Bookings</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Book Your Movie Tickets</h2>
            <p>Choose from the latest movies and enjoy the best cinema experience</p>
        </section>

        <section class="movies-section">
            <h3>Now Showing</h3>
            <div class="movies-grid" id="moviesGrid">
                <!-- Movies will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body">
                <div class="movie-details-container">
                    <img id="modalPoster" src="" alt="Movie Poster" class="modal-poster">
                    <div class="movie-info">
                        <h2 id="modalTitle"></h2>
                        <div class="movie-meta">
                            <span id="modalGenre"></span>
                            <span id="modalDuration"></span>
                            <span id="modalRating"></span>
                        </div>
                        <p id="modalDescription"></p>
                        <div class="showtimes">
                            <h4>Select Showtime:</h4>
                            <div id="showtimesList" class="showtime-buttons">
                                <!-- Showtimes will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 CineBook. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
